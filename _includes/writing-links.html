<nav class="writing-links" aria-label="Writing and reading">
  {% for item in page.writing_links %}
  <a class="writing-card" href="{{ item.url | escape }}" target="_blank" rel="noopener noreferrer">
    <span class="writing-card-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" focusable="false">
        {% if item.icon == 'book' %}
        <path d="M12 5c-3-2-6-2-10-1v15c4-1 7-1 10 1 3-2 6-2 10-1V4c-4-1-7-1-10 1ZM12 5v15" />
        <path d="M5 8c1.5-.2 2.5 0 4 .5M5 12c1.5-.2 2.5 0 4 .5M15 8.5c1.5-.5 2.5-.7 4-.5M15 12.5c1.5-.5 2.5-.7 4-.5" />
        {% else %}
        <path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5 9 9 0 0 1-4-.9L3 21l1.9-5.5a9 9 0 0 1-.9-4A8.5 8.5 0 0 1 12.5 3a8.5 8.5 0 0 1 8.5 8.5Z" />
        <path d="M8.5 11.5h.01M12.5 11.5h.01M16.5 11.5h.01" stroke-width="2.5" />
        {% endif %}
      </svg>
    </span>
    <span class="writing-card-title">{{ item.title | escape }}</span>
    <svg class="writing-card-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
      <path d="M7 17 17 7M7 7h10v10" />
    </svg>
    <span class="sr-only"> (opens in a new tab)</span>
  </a>
  {% endfor %}
</nav>
